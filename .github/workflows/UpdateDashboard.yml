name: Update GitHub dashboard

on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:
  push:
    paths: ["scripts/UpdateDashboard.py"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate dashboard
        env:
          GH_USER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: python scripts/UpdateDashboard.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@://github.com"
          git add github-dashboard.svg
          git diff --staged --quiet || (git commit -m "chore: update dashboard" && git push)
